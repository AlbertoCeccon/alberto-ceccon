<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080808">
  <meta name="description" content="Il biglietto digitale di Alberto Ceccon, Residential Client Manager presso BTWN - Contract & Design.">
  <title>Alberto Ceccon · BTWN</title>
  <style>
    :root { color-scheme: light; --oro:#806333; --oro-scuro:#69502a; --inchiostro:#352e26; --sfondo:#faf6ef; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; min-height:100svh; display:grid; place-items:center; padding:18px 14px; background:#eee6db; font-family:Arial,Helvetica,sans-serif; color:var(--inchiostro); }
    .card { position:relative; isolation:isolate; overflow:hidden; width:100%; max-width:390px; padding:30px 22px 28px; background:var(--sfondo); border:1px solid #e8ddce; border-radius:26px; box-shadow:0 16px 48px #57442b18; text-align:center; }
    .card::before,.card::after { content:""; position:absolute; z-index:-1; width:240px; height:200px; background:#d7c4a4; }
    .card::before { top:-130px; right:-105px; border-radius:30% 60% 35% 75%; transform:rotate(35deg); }
    .card::after { bottom:-161px; left:-96px; border-radius:55% 70% 30% 40%; transform:rotate(22deg); background:#c9b38e; }
    .portrait { width:112px; height:112px; margin:0 auto 13px; display:block; object-fit:cover; object-position:center; border:4px solid #fffaf3; border-radius:50%; background:#e6dac9; color:var(--oro); box-shadow:0 3px 14px #57442b10; }
    h1 { margin:0 0 5px; font-size:29px; line-height:1.15; letter-spacing:-.7px; }
    .role { margin:0 0 4px; font-size:15px; line-height:1.35; color:var(--oro-scuro); }
    .company { margin:0; font-size:13px; font-weight:600; line-height:1.4; color:#6d6051; }
    .divider { width:42px; height:3px; border-radius:3px; background:#b89a65; margin:13px auto 16px; }
    .contacts { display:grid; gap:0; padding:2px 12px; margin-bottom:17px; text-align:left; background:#fffaf4; border:1px solid #eee3d5; border-radius:15px; box-shadow:0 3px 7px #57442b0d; }
    .contact { display:flex; align-items:center; gap:12px; min-height:49px; padding:11px 2px; text-decoration:none; color:var(--inchiostro); font-size:14px; line-height:1.35; overflow-wrap:anywhere; }
    .contact + .contact { border-top:1px solid #eee5d9; }
    .contact::after { content:"›"; margin-left:auto; padding-left:3px; color:#a99a85; font-size:23px; line-height:1; }
    .contact:hover { background:#f3eadc; }
    .contact svg { width:21px; height:21px; flex-shrink:0; color:var(--oro); }
    .save { display:flex; align-items:center; justify-content:center; gap:10px; min-height:48px; padding:13px; border-radius:12px; background:var(--oro); color:#fffdf8; text-decoration:none; font-size:13px; letter-spacing:1.2px; font-weight:700; box-shadow:0 4px 12px #80633320; }
    .save:hover { background:var(--oro-scuro); }
    .save svg { width:21px; height:21px; }
    a:focus-visible { outline:3px solid #a17b3e; outline-offset:3px; }
    .hint { margin:10px 0 0; font-size:11px; color:#756755; line-height:1.4; }
    @media (max-width:360px) { .card { padding:25px 16px 25px; } h1 { font-size:27px; } .contact { font-size:13px; gap:9px; } .contacts { padding-inline:10px; } }
    @media (prefers-reduced-motion:no-preference) { a { transition:background .18s ease; } }
      /* Variante BTWN: nero, bianco e arancione. */
    :root { --oro:#ff6500; --oro-scuro:#ff812e; --inchiostro:#ffffff; --sfondo:#080808; }
    body { background:#1b1b1b; }
    .card { border:1px solid #303030; background:var(--sfondo); box-shadow:0 16px 48px #0005; }
    .card::before,.card::after { width:240px; height:200px; background:var(--oro); border:0; }
    .card::before { top:-130px; right:-105px; border-radius:30% 60% 35% 75%; transform:rotate(35deg); }
    .card::after { bottom:-161px; left:-96px; border-radius:55% 70% 30% 40%; transform:rotate(22deg); background:var(--oro); }
    .portrait { border-color:#ff6500; background:#222; box-shadow:0 3px 14px #0004; }
    .role { color:#ff812e; }
    .company { color:#c9c9c9; }
    .divider { background:var(--oro); }
    .contacts { background:#151515; border-color:#303030; box-shadow:none; }
    .contact + .contact { border-color:#333; }
    .contact::after { color:#a6a6a6; }
    .contact:hover { background:#242424; }
    .contact svg { color:var(--oro); }
    .save { color:#080808; box-shadow:0 4px 12px #ff650018; }
    a:focus-visible { outline-color:#ff812e; }
    .hint { color:#bdbdbd; }
      .card::before,.card::after { content:none; }
  </style>
</head>
